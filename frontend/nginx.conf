server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access — lets both the dnyansetu marketing pages and the
    # React app call relative /api/... paths with no CORS setup needed.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React app (education management system) — served under /app/
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Marketing site (dnyansetu) — static multi-page site at the root
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
